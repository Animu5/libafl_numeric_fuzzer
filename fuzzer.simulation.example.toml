# Example only: replace paths and supply Chipyard-specific flags before running.
# Use with: libafl_fuzzer --config fuzzer.simulation.example.toml (CLI flags override these values)
backend = "simulation"
assembly_environment = "/path/to/snippet_build"
riscv_toolpath = "/path/to/riscv"
solutions_path = "./simulation-solutions"
# Grammar the inputs are generated from (Nautilus JSON; default: grammars/riscv64g.json,
# converted from grammars/RISCV64G.g4 by tools/g4_to_nautilus.py).
# grammar = "grammars/riscv64g.json"
# Tree depth: must exceed the grammar's minimum derivation size; caps program size (default: 512)
# grammar_depth = 512
# Number of grammar-generated inputs in the initial corpus (default: 64)
# grammar_seeds = 64
# ISA gate (required): reads a candidate program on stdin, fixes crashing snippets
# (memory addresses/alignment), prints the fixed program on stdout, exit 0;
# exit nonzero = snippet rejected and skipped.
isa_gate = "/path/to/atnwalk/build/isagate"
# isa_gate_timeout_ms = 5000

# log_file = "fuzzer.log"
# snippet_dir = "./snippets"  # keep every generated snippet as NNNNNN.S (debugging)
# Log filter for the log file (default: RUST_LOG if set, else "info"); "debug" shows
# every snippet build, simulation and in-process VCD analysis, and each skipped input.
# log_level = "info"
# Progress display: "tui" (default), "print" (stdout), "log" (periodic lines in the log file), "none"
# monitor = "tui"

simulator_path = "/path/to/chipyard/verilator-simulator"
simulator_working_dir = "/path/to/chipyard/simulator/working-directory"
# Per-run trace directories (numeric-fuzzer-vcd-*) are created here, or inside
# simulator_working_dir by default; /tmp is not used because traces can be huge.
# vcd_dir = "/path/to/large-disk/traces"
# 10,000,000 cycles is a placeholder, not a verified one-millisecond limit.
# Add DRAMSim arguments if needed.
# {elf} is passed both to LOADMEM and as the positional binary.
simulator_arg = [
    "+permissive",
    "+max-cycles=10000000",
    "+loadmem={elf}",
    "+vcdfile={vcd}",
    "+permissive-off",
    "{elf}",
]
# The VCD is analyzed in-process by the integrated vcdtogglerate engine (no external
# analyzer binary); each run yields a trace map (primary feedback) plus toggle
# activity (secondary) and toggle coverage.
target_scope = "TOP.path.to.target"
# exclude_signal_file = "/path/to/excluded-signals.txt"
# 10,000,000 cycles takes minutes in Verilator, so the defaults leave room for that.
simulator_timeout_ms = 600000
# Must exceed the simulator timeout, plus time to build each ELF and analyze the VCD.
exec_timeout_ms = 900000

# Optional parallel workers on a single node (LibAFL Launcher + LLMP shared memory).
# Workers are forked and pinned to cores from the process affinity mask (SLURM
# --cpus-per-task); they exchange inputs instantly over shared memory.
# The parent of the fresh workspace must exist; the workspace itself and
# solutions_path/parallel-exchange must not exist.
# workers = 2
# worker_workspace = "/path/to/new-worker-workspace"
# Alternatively, provide pre-existing isolated directories explicitly:
# worker_assembly_environment = ["/path/to/build-worker-0", "/path/to/build-worker-1"]
# worker_simulator_working_dir = ["/path/to/sim-worker-0", "/path/to/sim-worker-1"]

# Hardware backend only (see fuzzer.example.toml); ignored with backend = "simulation":
# openocd_addr = "127.0.0.1:6666"
# scope_resource = "USB0::0x05ff::0x1023::SERIAL::INSTR"  # see --list-scopes
# scope_timeout_ms = 5000
# scope_acquire_timeout_ms = 30000
# settle_ms = 100
