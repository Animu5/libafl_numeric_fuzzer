[package]
name = "libafl_fuzzer"
version = "0.10.0"
edition = "2024"

[features]
default = ["hardware"]
hardware = ["dep:visa-rs"]

[dependencies]
libafl = { version = "0.16.1", features = ["tui_monitor", "afl_exec_sec", "track_hit_feedbacks", "introspection"] }
libafl_bolts = { version = "0.16.1", features = ["cli"] }
clap = { version = "4.6", features = ["derive"]}
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "tracing-log"] }
visa-rs = { version = "0.7.1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
libc = "0.2"
tempfile = "3"
wellen = "0.25.7"
memchr = "2"
memmap2 = "0.9"
